[package]
name = "duststorm"
version = "0.1.0"
edition = "2021"
default-run = "perlin1"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
geo-types = "0.4.3"
nannou = "0.19.0"
offset-polygon = "0.1.0"
palette = "0.7.5"
voronoice = "0.2.0"

[[bin]]
name = "voronoi"
path = "src/voronoi.rs"

[[bin]]
name = "perlin1"
path = "src/perlin1.rs"

[[bin]]
name = "perlin2"
path = "src/perlin2.rs"
